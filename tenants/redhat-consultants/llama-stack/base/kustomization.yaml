apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama-stack

resources:
- namespace-llama-stack.yaml
- secret-pgvector.yaml 
- secret-llama-stack.yaml
- llama-stack.yaml
- route.yaml

generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: llama-stack-config
    files:
      - run.yaml

helmGlobals:
  chartHome: ./charts

helmCharts:
  - name: pgvector
    releaseName: pgvector
    namespace: llama-stack
    valuesFile: ./charts/pgvector/values.yaml