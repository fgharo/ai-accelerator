apiVersion: v1
kind: Service
metadata:
  name: {{ include "marketplace-mcp.fullname" . }}
  labels:
    {{- include "marketplace-mcp.labels" . | nindent 4 }}
spec:
  ipFamilies:
    - IPv4
  type: {{ .Values.service.type }}
  selector:
    {{- include "marketplace-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- if eq .Values.service.sessionAffinity "ClientIP" }}
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.service.sessionAffinityTimeoutSeconds }}
  {{- end }}
