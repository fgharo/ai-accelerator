apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama-stack

resources:
- namespace-llama-stack.yaml

generatorOptions:
  disableNameSuffixHash: true

helmGlobals:
  chartHome: ./charts

helmCharts:
  - name: marketplace-mcp
    releaseName: marketplace-mcp
    namespace: llama-stack
    valuesFile: ./charts/marketplace-mcp/values.yaml