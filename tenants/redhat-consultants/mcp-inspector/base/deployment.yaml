---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-inspector
  namespace: mcp-inspector
  labels:
    app: mcp-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-inspector
  template:
    metadata:
      labels:
        app: mcp-inspector
    spec:
      # imagePullSecrets:
      #   - name: artifactory-secret
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: mcp-inspector
          persistentVolumeClaim:
            claimName: mcp-inspector
      serviceAccountName: mcp-inspector
      serviceAccount: mcp-inspector
      containers:
      - name: mcp-inspector
        image: PATCH_ME
        resources:
          limits:
            cpu: 1
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 6274
            scheme: HTTP
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 6274
            scheme: HTTP
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 3
        env:
        - name: HOST
          value: 0.0.0.0
        - name: DANGEROUSLY_BIND_ALL_INTERFACES
          value: "true"
        - name: ALLOWED_ORIGINS
          value: "https://mcp-inspector-mcp-inspector.apps.ocp.rcqxc.sandbox1982.opentlc.com,https://mcp-inspector-ws=mcp-inspector.apps.ocp.rcqxc.sandbox1982.opentlc.com/"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: DEBUG
          value: mcp*  
        securityContext:
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        ports:
          - name: inspector
            containerPort: 6274
            protocol: TCP
        imagePullPolicy: Always
        volumeMounts:
          - name: tmp-dir
            mountPath: /tmp
          - name: mcp-inspector
            mountPath: /home/node/.mcp-inspector
