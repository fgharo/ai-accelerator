apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

resources:
 - namespace-backstage.yaml
 - github-secrets.yaml

helmCharts:
  - name: redhat-developer-hub
    repo: https://charts.openshift.io/
    version: 1.8.5
    releaseName: redhat-developer-hub
    valuesFile: rhdh-1.8.5-values.yaml
    namespace: backstage